# Nginx Production Reverse Proxy Configuration for Linux CTF Academy
# Dedicated Port Range: 2000-2009
# Place in /etc/nginx/sites-available/linux-ctf-academy and symlink to /etc/nginx/sites-enabled/

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ctf_backend {
    server 127.0.0.1:2000;
    keepalive 32;
}

server {
    # Dedicated Reverse Proxy Gateway Port in 2000-2009 range (Port 2001)
    # (You can also add 'listen 80;' or 'listen 443 ssl;' if routing a domain directly)
    listen 2001;
    listen [::]:2001;
    server_name _; # Replace with domain name or IP in production

    client_max_body_size 50M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript;

    # 1. Native Terminal PTY WebSocket Bridge
    location /pty {
        proxy_pass http://ctf_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WebSocket connection open during long terminal sessions
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. REST API & Local LLM Endpoints
    location /api/ {
        proxy_pass http://ctf_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeout for 70B local LLM inference on RTX 6000 GPU
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }

    # 3. Frontend Single Page Application & Static Assets
    location / {
        proxy_pass http://ctf_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
